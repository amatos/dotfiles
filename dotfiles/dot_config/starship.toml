#context = 'teleport-[^-]*-(?P<env>[^.]*)\.(?P<cloud>[^.]*)\.(?P<account>[^.]*)\.(?P<region>[^.]*)\.(?P<plane>[^.]*)'
#context_alias = '$env $plane ☁️ $cloud 🌎 $region 🏛️ $account'
#
#[[kubernetes.contexts]]
#context = 'teleport-[^-]*-(?P<env>[^.]*)\.(?P<cloud>[^.]*)\.(?P<account>[^.]*)\.(?P<region>[^.]*)\.(?P<plane>[^.]*)\.classic\.(?P<tenant>.*)'
#context_alias = '$env classic ☁️ $cloud 🌎 $region 🏛️ $account 🏠 $tenant'




[docker_context]
format = "[🐋 $context](blue bold)"

[aws]
format = ' [$symbol ($profile )(\($region\) )]($style)'
style = "bold blue"
symbol = "🟧"
[aws.region_aliases]
us-east-2 = "US:E:2"
us-west-2 = "US:W:2"
eu-west-2 = "EU:W:2"

[gcloud]
format = '[$symbol $account(@$domain)(\($region\))]($style) '
symbol = "⛅"
[gcloud.region_aliases]
us-central1 = "uc1"
asia-northeast1 = "an1"

[azure]
disabled = false
format = "[$symbol ($subscription)]($style) "
symbol = "🔷"
style = "blue bold"

[git_branch]
symbol = "🌱 "
truncation_length = 8
truncation_symbol = ""
style = "bold yellow"

#format = " [$branch]($style) "
#symbol = "🍣 "

[git_commit]
commit_hash_length = 8
style = "bold white"

[git_state]
format = '[\($state( $progress_current of $progress_total)\)]($style)'

[git_metrics]
added_style = "bold blue"
format = '[+$added]($added_style)/[-$deleted]($deleted_style) '

[git_status]
conflicted = "💥 "
ahead = "🚀 x${count}"
behind = "🐢 x${count}"
diverged = "🔱 🚀 x${ahead_count} 🐢 x${behind_count}"
untracked = "🚧 x${count}"
stashed = "📦 "
modified = "📝 x${count}"
staged = "📥 x${count}"
renamed = "📛 x${count}"
deleted = "❌ x${count}"
style = "bright-white"
format = "$all_status$ahead_behind"

[terraform]
format = "[🧱 $version$workspace]($style)"

[pulumi]
format = "[🚢 ($version )$stack]($style)"

[helm]
format = "[⎈ $version](bold white) "

[rust]
format = "[🦀 $version](red bold)"

[python]
symbol = "👾 "
pyenv_version_name = true
# Display the version of python from inside a local venv.
#
# Note this will only work when the venv is inside the project and it will only
# work in the directory that contains the venv dir but maybe this is ok?
python_binary = ["./venv/bin/python", "python", "python3", "python2"]

[nodejs]
format = "[🤖 $version](bold green)"

[golang]
format = "[🐹 $version](bold cyan)"

[cmd_duration]
min_time = 500
format = " [$duration](bold yellow)"

