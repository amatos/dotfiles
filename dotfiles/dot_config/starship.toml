# ~/.config/starship.toml

# Default is 500ms — bump to 1s so custom modules whose `when`/`command` shells
# out (e.g. `[custom.tztime]` with `when = "true"`) don't trip the WARN on
# slower-starting shells (xonsh, in particular, has measurable subprocess
# overhead vs zsh).
command_timeout = 1000

format = """
$battery\
${custom.tztime}\
$username\
$hostname\
$directory\
$memory_usage\
$git_branch\
$git_commit\
$git_state\
$git_metrics\
$git_status\
$kubernetes\
$helm\
$terraform\
$pulumi\
$azure\
$gcloud\
$aws\
$docker_context\
$env_var\
$golang\
$nodejs\
$java\
$ruby\
$rust\
$python\
$cmd_duration\
$status\
$sudo\
$line_break\
$shell \
$character"""

# Move the directory to the second line
#format="$all$directory$character"

[custom.tztime]
# with day and month
# command = 'date+"%a-%d-%h %H:%M:%S(%Z)"'
command = 'date +"%H:%M:%S[%Z]"'
when = "true"
style = "yellow"
format = '[$symbol($output)]($style) '

[custom.uptime]
command = "uptime-mine"
format = "[$symbol($output)](green)"
disabled = true

[line_break]
disabled = false

[shell]
bash_indicator = "🐚"
zsh_indicator = "🦓"
fish_indicator = "🐟"
xonsh_indicator = "🐍"
powershell_indicator = "_"
unknown_indicator = "mystery shell"
format = '[$indicator](fg:white)'
disabled = false

[status]
style = "bg:#CC99CC"
symbol = "🔴"
format = '[\[$symbol $common_meaning$signal_name$maybe_int\]]($style)'
map_symbol = true
disabled = false

[sudo]
style = "bold red"
symbol = "🧙 "
disabled = false
allow_windows = true
format = "$symbol($style)"

[hostname]
ssh_only = false
trim_at = ".companyname.com"
disabled = false
format =  "@[$hostname](bold red):"

[username]
# style_user = "fg:#CC99CC"
# style_root = "white"
style_user = "bold green"
style_root = "black red"
show_always = true
format = "[$user]($style)"

[character]
success_symbol = "[➜](bold green) "
error_symbol = "[✗](bold red) "
vicmd_symbol = "[V](bold green) "

[directory]
format = "[$path]($style)[$read_only]($read_only_style) "
style = "bold #f57800"
read_only = "🔒"
read_only_style = "red"
truncation_symbol = "…/"
truncation_length = 3
truncate_to_repo = true

[time]
time_format = "%R"
format = "🕙 $time($style) "
style = "bright-white"
disabled = true

[memory_usage]
disabled = false
format = "$symbol [${ram_pct}(|${swap_pct})]($style) "
threshold = -1
symbol = "🐏"
#style = "bold dimmed green"
style = "fg:#E29191"

[battery]
full_symbol = "🔋 "
charging_symbol = "⚡ "
discharging_symbol = "💀 "

[[battery.display]]  # "bold yellow" style when capacity is between 10% and 30%
threshold = 100
style = "bold yellow"

#[env_var.SHELL]
#variable = "SHELL"
#default = "unknown shell"
#[env_var.USER]
#default = "unknown user"

